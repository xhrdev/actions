name: dependabot approve and automerge

on:
  pull_request:
    branches:
      - master
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  dependabot-approve-and-automerge:
    runs-on: ubuntu-slim # https://docs.github.com/en/actions/reference/runners/github-hosted-runners#single-cpu-runners
    timeout-minutes: 2
    permissions:
      pull-requests: write
      contents: write

    if: ${{ github.actor == 'dependabot[bot]' }}

    steps:
      - uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # auto-merge first, then approve: once the PR is approved and this job is
      # its only pending check, github reports it as unstable and refuses to
      # enable auto-merge. while it still waits on the review, enabling it is
      # allowed.
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Approve a PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
