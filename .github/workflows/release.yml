# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: release

on:
  workflow_call:
    inputs:
      download-dist-artefacts: # for tls
        type: boolean
        required: false
        default: false
      python:
        type: boolean
        required: false
        default: false
    outputs:
      new_release_version:
        value: ${{ jobs.publish-artifact.outputs.new_release_version }}
      new_release_published:
        value: ${{ jobs.publish-artifact.outputs.new_release_published }}

defaults:
  run:
    shell: bash

jobs:
  publish-artifact:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: write
      issues: write
      actions: none
      id-token: write
      packages: write
    outputs:
      new_release_version:   ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v5
        if: inputs.python
        with:
          python-version-file: .python-version

      - name: Download dist artefacts # for tls
        if: inputs.download-dist-artefacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Set up NPM authentication
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - uses: cycjimmy/semantic-release-action@v6
        id: semantic # need an `id` for output variables
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/git@10.0.1
            @semantic-release/changelog@6.0.3
            @semantic-release/exec@7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=10240"

      - name: codecov
        if: steps.semantic.outputs.new_release_published == 'true'
        run: bash <(curl -s https://codecov.io/bash);

      - name: Upload build artefact
        if: steps.semantic.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: build-artefact
          path: .
          retention-days: 1
