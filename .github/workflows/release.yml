# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: release

on:
  workflow_call:
    inputs:
      chrome-arm64: # real Google Chrome, not chromium; ubuntu-24.04-arm has neither preinstalled
        type: boolean
        required: false
        default: false
      codecov: # upload coverage to codecov; repos that do not use codecov pass false
        type: boolean
        required: false
        default: true
      download-dist-artefacts: # for tls
        type: boolean
        required: false
        default: false
      include-node-modules:
        type: boolean
        required: false
        default: false
      python:
        type: boolean
        required: false
        default: false
      upload-build-artefact:
        type: boolean
        required: false
        # Default true preserves the current behaviour for pipelines that
        # consume the artefact downstream (xhrdev's merge-manifest downloads
        # it). Repos without a consumer should pass false: a published release
        # uploads on every push otherwise, and the org's artifact storage
        # quota is already exhausted. The pr workflow's input of the same
        # name already defaults false, and no pr caller overrides it.
        default: true
      semantic-release:
        type: boolean
        required: false
        # Default true: semantic-release stays the release gate through
        # verifyConditionsCmd, as it is for xhrdev. A caller that only wants
        # the gate passes false — the `make ci` step below runs instead, and
        # nothing publishes: no tag, no notes ref, no codecov, no artefact.
        default: true
    secrets:
      # Exported to the semantic-release step as the env var of the same name,
      # because that is where verifyConditionsCmd runs `make ci` on this path
      # (status). Callers that `secrets: inherit` need only set a repo secret
      # called API_KEY; repos that do not set one see an empty env var.
      API_KEY:
        required: false
    outputs:
      new_release_version:
        value: ${{ jobs.publish-artefact.outputs.new_release_version }}
      new_release_published:
        value: ${{ jobs.publish-artefact.outputs.new_release_published }}

defaults:
  run:
    shell: bash

jobs:
  publish-artefact:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      pull-requests: write
      contents: write
      issues: write
      actions: none
      id-token: write
      packages: write
    outputs:
      new_release_version:   ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        if: inputs.python
        with:
          python-version-file: .python-version

      - name: Download dist artefacts # for tls
        if: inputs.download-dist-artefacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Set up NPM authentication
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      # playwright-core's own chrome installer refuses arm64 outright and only
      # ever fetches the amd64 .deb, so `playwright install chrome` cannot do
      # this even now that Google ships one. Installed straight from Google's
      # repo instead, at the path playwright's `channel: 'chrome'` already
      # looks for (it only checks the path, not the arch) — see
      # https://dl.google.com/linux/direct/google-chrome-stable_current_arm64.deb
      - name: Install Chrome (arm64)
        if: inputs.chrome-arm64
        run: |
          curl -fsSL -o /tmp/chrome-arm64.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_arm64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/chrome-arm64.deb
          rm -f /tmp/chrome-arm64.deb
          google-chrome --version

      # The gate when the caller opted out of semantic-release: same command,
      # run directly. API_KEY is the optional secret declared on
      # workflow_call (#45) — callers that `secrets: inherit` need only set a
      # repo secret of that name; status's sensor lane gates `make ci` on it.
      - run: make ci
        if: ${{ !inputs.semantic-release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=10240"
          API_KEY: ${{ secrets.API_KEY }}

      - uses: cycjimmy/semantic-release-action@v8.1.4
        id: semantic # need an `id` for output variables
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/git@10.0.1
            @semantic-release/changelog@6.0.3
            @semantic-release/exec@7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=10240"
          # verifyConditionsCmd runs `make ci` in here (status); its live
          # sensor lane needs the key
          API_KEY: ${{ secrets.API_KEY }}

      - name: codecov
        if: steps.semantic.outputs.new_release_published == 'true' && inputs.codecov
        run: bash <(curl -s https://codecov.io/bash);

      - name: Upload build artefact (with node_modules)
        if: steps.semantic.outputs.new_release_published == 'true' && inputs.upload-build-artefact && inputs.include-node-modules
        uses: actions/upload-artifact@v7
        with:
          name: build-artefact
          # upload-artifact excludes dotfiles by default, so the artefact
          # arrived without .nvmrc (setup-node reads it), .dockerignore (docker
          # build honours it) or .npmrc. `.git` stays out: large, and nothing
          # downstream reads it.
          include-hidden-files: true
          path: |
            .
            !.git/**
          retention-days: 1

      - name: Upload build artefact
        if: steps.semantic.outputs.new_release_published == 'true' && inputs.upload-build-artefact && !inputs.include-node-modules
        uses: actions/upload-artifact@v7
        with:
          name: build-artefact
          # upload-artifact excludes dotfiles by default, so the artefact
          # arrived without .nvmrc (setup-node reads it), .dockerignore (docker
          # build honours it) or .npmrc. `.git` stays out: large, and nothing
          # downstream reads it.
          include-hidden-files: true
          path: |
            .
            !node_modules/**
            !.git/**
          retention-days: 1
