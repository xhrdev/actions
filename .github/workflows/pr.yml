# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: pr

on:
  workflow_call:
    inputs:
      download-dist-artefacts: # for tls
        type: boolean
        required: false
        default: false

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: read
      actions: none
      id-token: none
      packages: none

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Download dist artefacts # for tls
        if: inputs.download-dist-artefacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Set up NPM authentication
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.READ_ONLY_PAT }}" >> ~/.npmrc

      - run: make ci
        env:
          GITHUB_TOKEN: ${{ secrets.READ_ONLY_PAT }}
          NPM_TOKEN: ${{ secrets.READ_ONLY_PAT }}
          NODE_AUTH_TOKEN: ${{ secrets.READ_ONLY_PAT }}
          NODE_OPTIONS: "--max-old-space-size=10240"

      - name: Set up NPM authentication
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - uses: cycjimmy/semantic-release-action@v6
        id: semantic
        with:
          dry_run: true
          semantic_version: 24
          extra_plugins: |
            @semantic-release/git@10.0.1
            @semantic-release/changelog@6.0.3
            @semantic-release/exec@7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=10240"

      - run: bash <(curl -s https://codecov.io/bash)

      - name: Upload build artefact
        uses: actions/upload-artifact@v7
        with:
          name: build-artefact
          path: .
          retention-days: 1
