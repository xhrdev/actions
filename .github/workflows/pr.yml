# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: pr

on:
  workflow_call:
    inputs:
      chrome-arm64: # real Google Chrome, not chromium; ubuntu-24.04-arm has neither preinstalled
        type: boolean
        required: false
        default: false
      download-dist-artefacts: # for tls
        type: boolean
        required: false
        default: false
      python:
        type: boolean
        required: false
        default: false
      upload-build-artefact:
        type: boolean
        required: false
        default: false

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: read
      actions: none
      id-token: none
      packages: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@v7
        if: inputs.python
        with:
          python-version-file: .python-version

      - name: Download dist artefacts # for tls
        if: inputs.download-dist-artefacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Set up NPM authentication
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      # playwright-core's own chrome installer refuses arm64 outright and only
      # ever fetches the amd64 .deb, so `playwright install chrome` cannot do
      # this even now that Google ships one. Installed straight from Google's
      # repo instead, at the path playwright's `channel: 'chrome'` already
      # looks for (it only checks the path, not the arch) — see
      # https://dl.google.com/linux/direct/google-chrome-stable_current_arm64.deb
      - name: Install Chrome (arm64)
        if: inputs.chrome-arm64
        run: |
          curl -fsSL -o /tmp/chrome-arm64.deb \
            https://dl.google.com/linux/direct/google-chrome-stable_current_arm64.deb
          sudo apt-get update -qq
          sudo apt-get install -y -qq /tmp/chrome-arm64.deb
          rm -f /tmp/chrome-arm64.deb
          google-chrome --version

      - run: make ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=10240"

      - uses: cycjimmy/semantic-release-action@v8.1.4
        id: semantic
        with:
          dry_run: true
          semantic_version: 24
          extra_plugins: |
            @semantic-release/git@10.0.1
            @semantic-release/changelog@6.0.3
            @semantic-release/exec@7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_OPTIONS: "--max-old-space-size=10240"

      - run: bash <(curl -s https://codecov.io/bash)

      - name: Upload build artefact
        if: inputs.upload-build-artefact
        uses: actions/upload-artifact@v7
        with:
          name: build-artefact
          # upload-artifact excludes dotfiles by default, so the artefact
          # arrived without .nvmrc (setup-node reads it), .dockerignore (docker
          # build honours it) or .npmrc. `.git` stays out: large, and nothing
          # downstream reads it.
          include-hidden-files: true
          path: |
            .
            !node_modules/**
            !.git/**
          retention-days: 1
